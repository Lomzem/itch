[workspace]
resolver = "3"
members = ["crates/itch-core", "crates/itch-firmware", "crates/itch-sim"]

[workspace.package]
version = "0.1.1"
edition = "2024"
publish = false

[workspace.dependencies]
itch-core = { path = "crates/itch-core" }
log = "0.4.34"
serde_json = "1"

# The Rig firmware: `cargo +esp build-firmware`.
[profile.firmware]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  sim:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            # musl links statically, so the binary runs on any Linux.
            target: x86_64-unknown-linux-musl
            exe: ""
            asset: itch-sim-linux-x86_64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            exe: .exe
            asset: itch-sim-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: rustup default stable
      - run: cargo test --workspace --locked
      # A static CRT spares QA the Visual C++ runtime on Windows.
      - run: cargo build --release --locked -p itch-sim --target ${{ matrix.target }}
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/itch-sim${{ matrix.exe }}" "dist/${{ matrix.asset }}"
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: sim
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the tag matches the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "itch-sim") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the workspace version $version"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cp docs/protocol/vectors-v1.json dist/
      - name: Write the manifest
        run: |
          python3 - <<'EOF'
          import hashlib, json, os, pathlib

          dist = pathlib.Path("dist")
          vectors = json.loads((dist / "vectors-v1.json").read_text(encoding="utf-8"))
          manifest = {
              "tag": os.environ["GITHUB_REF_NAME"],
              "commit": os.environ["GITHUB_SHA"],
              "protocol": vectors["protocol"],
              "sha256": {
                  path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(dist.iterdir())
              },
          }
          (dist / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          EOF
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  core-no-std:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --target thumbv7em-none-eabihf
      - run: rustup default stable
      # Any bare-metal target proves itch-core needs no std.
      - run: cargo build -p itch-core --target thumbv7em-none-eabihf

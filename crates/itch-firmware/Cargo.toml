[package]
name = "itch-firmware"
description = "The itch Rig firmware for the ESP32-S3: board support and the USB transport."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "itch-firmware"
path = "src/main.rs"
required-features = ["firmware"]
test = false
bench = false

[features]
# Builds the firmware for the Rig. Without it only the chip-independent
# modules build, so host `cargo test` covers them.
firmware = [
    "dep:embassy-executor",
    "dep:embassy-futures",
    "dep:embassy-sync",
    "dep:embassy-time",
    "dep:embedded-io-async",
    "dep:esp-bootloader-esp-idf",
    "dep:esp-hal",
    "dep:esp-rtos",
    "dep:log",
    "dep:static_cell",
]

[dependencies]
embedded-hal = "1.0.0"
itch-core.workspace = true

embassy-executor = { version = "=0.10.0", optional = true }
embassy-futures = { version = "=0.1.2", optional = true }
embassy-sync = { version = "=0.8.0", optional = true }
embassy-time = { version = "=0.5.1", optional = true }
embedded-io-async = { version = "=0.7.0", optional = true }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32s3"], optional = true }
esp-hal = { version = "=1.2.2", features = ["esp32s3", "unstable"], optional = true }
esp-rtos = { version = "=0.4.0", features = ["esp32s3", "embassy"], optional = true }
log = { workspace = true, optional = true }
static_cell = { version = "=2.1.1", optional = true }
